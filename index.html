/* =========================================================

========================================================= */

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}


/* =========================================================
   6. TẠO TÊN NGƯỜI

   Random giới tính:
   - 50% nam
   - 50% nữ

   Sau khi chọn giới tính sẽ lấy họ, đệm và tên
   hoàn toàn từ danh sách của giới tính đó.
========================================================= */

function randomName() {

    const laNam = Math.random() < 0.5;

    const ho = laNam ? hoNam : hoNu;
    const tenDem = laNam ? tenDemNam : tenDemNu;
    const ten = laNam ? tenNam : tenNu;

    return `${randomItem(ho)} ${randomItem(tenDem)} ${randomItem(ten)}`;
}


/* =========================================================
   7. TẠO SỐ NHÀ

   001 - 700
   Có thể kèm A/B/C/D/E/F

   3 kiểu:
   - Số nhà 123
   - Số 123
   - 123

   Tỷ lệ:
   - 33%
   - 33%
   - 34%
========================================================= */

function randomSoNha() {

    const number = Math.floor(Math.random() * 700) + 1;

    const formatted = String(number).padStart(3, "0");

    const letters = [
        "",
        "A",
        "B",
        "C",
        "D",
        "E",
        "F"
    ];

    const letter = randomItem(letters);

    const soNha = formatted + letter;

    const random = Math.random();

    if (random < 0.33) {
        return `Số nhà ${soNha}`;
    }

    if (random < 0.66) {
        return `Số ${soNha}`;
    }

    return soNha;
}


/* =========================================================
   8. TẠO TÊN ĐỊA ĐIỂM

   Không còn dùng danh sách tenDiaDiem.

   Tên địa điểm được tạo bằng:
   Loại địa điểm + Tên đệm + Tên

   Giới tính nam/nữ random 50 - 50,
   hoàn toàn độc lập với giới tính của tên người.
========================================================= */

function randomDiaDiem() {

    const loai = randomItem(loaiDiaDiem);

    const laNam = Math.random() < 0.5;

    const tenDem = laNam
        ? tenDemNam
        : tenDemNu;

    const ten = laNam
        ? tenNam
        : tenNu;

    return `${loai} ${randomItem(tenDem)} ${randomItem(ten)}`;
}

function randomTienTo() {

    const loai = randomItem([

    if (loai === "soNha") {
        return randomSoNha();
    }

    if (loai === "duong") {
        return randomItem(duong);
    }

    return randomDiaDiem();
}


/* =========================================================
   10. SHUFFLE
========================================================= */

function shuffle(array) {

    const arr = [...array];

    for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(
            Math.random() * (i + 1)
        );

        [arr[i], arr[j]] =
            [arr[j], arr[i]];
    }

    return arr;
}


/* =========================================================
   11. TẠO ĐỊA CHỈ
========================================================= */

function randomAddress() {

    /*
        Chọn xã trước.
        Sau đó chỉ lấy ấp trong đúng xã đó.
    */

    const selectedArea =
        randomItem(khuVuc);

    const xa =
        selectedArea.xa;

    const ap =
        randomItem(selectedArea.ap);


    /*
        Có 4 loại thành phần:

        - số nhà
        - đường
        - địa điểm
        - ấp

        Cần đúng 3 thành phần.

        Ấp luôn bắt buộc.

        Hai thành phần còn lại lấy ngẫu nhiên
        từ số nhà / đường / địa điểm.
    */

    const otherTypes =
        shuffle([
            "soNha",
            "duong",
            "diaDiem"
        ]).slice(0, 2);


    let parts = [];


    /*
        Thêm ấp.
    */

    parts.push(ap);


    /*
        Thêm 2 thành phần khác.
    */

    otherTypes.forEach(type => {

        if (type === "soNha") {
            parts.push(
                randomSoNha()
            );
        }

        else if (type === "duong") {
            parts.push(
                randomItem(duong)
            );
        }

        else if (type === "diaDiem") {
            parts.push(
                randomDiaDiem()
            );
        }

    });


    /*
        Xáo trộn hoàn toàn thứ tự
        của 3 thành phần.
    */

    parts = shuffle(parts);


    /*
        Cuối cùng thêm xã + tỉnh.
    */

    return (
        parts.join(", ") +
        ", " +
        xa +
        ", tỉnh Vĩnh Long"
    );
}

========================================================= */

    document

        .textContent = address;

    document
        .getElementById("status")
        .textContent = "";
}


/* =========================================================
   13. SAO CHÉP
========================================================= */

async function copyAll() {

    const name =
        document
            .getElementById("nameOutput")
            .textContent;

    const address =
        document
            .getElementById("addressOutput")
            .textContent;

    const text =
        `Tên: ${name}\n` +
        `Địa chỉ: ${address}`;


    try {

        await navigator
            .clipboard
            .writeText(text);

        document
            .getElementById("status")
            .textContent =
            "Đã sao chép tên và địa chỉ!";

        setTimeout(() => {

            document
                .getElementById("status")
                .textContent = "";

        }, 2000);

    }

    catch (error) {

        document
            .getElementById("status")
            .textContent =
            "Không thể sao chép tự động.";

    }
}
