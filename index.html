<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Tên & Địa Chỉ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(15, 23, 42, 0.10);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            font-size: 14px;
        }

        /* --- SETTINGS AREA --- */
        .settings-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .checkbox-container {
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            max-height: 180px;
            overflow-y: auto;
        }

        .check-all {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .xa-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .xa-list label {
            cursor: pointer;
            font-size: 15px;
        }

        /* --- RESULTS AREA --- */
        .result-box {
            margin-bottom: 18px;
        }

        .label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .output {
            min-height: 56px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            padding: 15px 16px;
            font-size: 17px;
            line-height: 1.5;
            word-break: break-word;
        }

        .address {
            font-size: 16px;
        }

        .input-symbol {
            padding: 5px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
            width: 160px;
        }
        .input-symbol:focus { border-color: #3b82f6; }

        /* --- BUTTONS --- */
        .button-row {
            display: flex;
            margin-top: 24px;
        }

        .copy-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .random-btn {
            width: 100%;
            background: #4f46e5;
            color: white;
            font-size: 16px;
        }

        .random-btn:hover { background: #4338ca; }

        .copy-btn {
            flex: 1;
            background: #e2e8f0;
            color: #334155;
            font-size: 14px;
            padding: 10px;
        }

        .copy-btn:hover { background: #cbd5e1; }

        .status {
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
            font-size: 13px;
            color: #16a34a;
            font-weight: bold;
        }

        /* --- USAGE LOG SECTION --- */
        .usage-section {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px dashed #cbd5e1;
        }

        .usage-header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .usage-header-main h2 {
            margin: 0;
            font-size: 20px;
            color: #1e293b;
        }

        .sort-select {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            outline: none;
            font-size: 13px;
            color: #1e293b;
            background-color: #fff;
            cursor: pointer;
        }

        .usage-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .usage-item {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 15px;
        }

        .usage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .usage-xa-name {
            font-weight: bold;
            font-size: 16px;
            color: #0f172a;
        }

        .usage-time {
            font-size: 13px;
            color: #64748b;
            display: flex;
            align-items: center;
        }

        .usage-time span {
            font-weight: bold;
            color: #3b82f6;
            margin-left: 5px;
        }

        .icon-btn {
            cursor: pointer;
            margin-left: 6px;
            color: #64748b;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }
        
        .icon-btn:hover {
            color: #3b82f6;
        }

        .usage-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-use { background: #3b82f6; color: white; }
        .btn-use:hover { background: #2563eb; }
        
        .btn-undo { background: #f59e0b; color: white; }
        .btn-undo:hover { background: #d97706; }

        .note-row {
            display: flex;
            gap: 8px;
        }

        .note-row input {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }
        
        .note-row input:focus {
            border-color: #3b82f6;
        }

        /* --- MODAL INPUT TIME --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .modal-box h3 {
            margin: 0 0 15px 0;
            color: #1e293b;
        }

        .modal-input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 5px;
        }
        
        .modal-input:focus {
            border-color: #3b82f6;
        }

        .modal-error {
            color: #ef4444;
            font-size: 13px;
            min-height: 18px;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            h1 { font-size: 24px; }
            .copy-row { flex-direction: column; }
            .xa-list { grid-template-columns: 1fr; }
            .usage-header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .usage-header-main { flex-direction: column; align-items: flex-start; gap: 10px;}
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>Random Tên & Địa Chỉ</h1>
        <div class="subtitle">Tạo ngẫu nhiên tên và địa chỉ giả lập tại tỉnh Vĩnh Long</div>

        <!-- CÀI ĐẶT HÀNH CHÍNH -->
        <div class="settings-box">
            <span class="label">Chọn dữ liệu hành chính:</span>
            <div class="radio-group">
                <label><input type="radio" name="addressType" value="moi"> Địa chỉ mới</label>
                <label><input type="radio" name="addressType" value="cu"> Địa chỉ cũ</label>
            </div>
            <div class="checkbox-container">
                <label class="check-all"><input type="checkbox" id="checkAll"> Tất cả</label>
                <div id="xaList" class="xa-list"></div>
            </div>
        </div>

        <!-- TÊN -->
        <div class="result-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="label" style="margin-bottom: 0;">Tên ngẫu nhiên</span>
                <input type="text" id="symbolInput" class="input-symbol" placeholder="Ký hiệu (VD: x, #...)" autocomplete="off">
            </div>
            <div class="output" id="nameOutput">Đang tạo...</div>
        </div>

        <!-- ĐỊA CHỈ -->
        <div class="result-box">
            <span class="label">Địa chỉ ngẫu nhiên</span>
            <div class="output address" id="addressOutput">Đang tạo...</div>
        </div>

        <div class="button-row">
            <button class="random-btn" onclick="generateAll()">Tạo ngẫu nhiên</button>
        </div>
        <div class="copy-row">
            <button class="copy-btn" onclick="copyName()">Copy Tên</button>
            <button class="copy-btn" onclick="copyAddress()">Copy Địa chỉ</button>
            <button class="copy-btn" onclick="copyAll()">Copy Tất cả</button>
        </div>
        <div class="copy-row">
            <button class="copy-btn" onclick="copyRandomPart()">Copy Phần địa chỉ</button>
            <button class="copy-btn" onclick="copyAdminPart()">Copy Xã đang chọn</button>
        </div>

        <div class="status" id="status"></div>

        <!-- KHU VỰC SỬ DỤNG GẦN ĐÂY -->
        <div class="usage-section">
            <div class="usage-header-main">
                <h2>Sử dụng gần đây:</h2>
                <select id="sortUsage" class="sort-select" onchange="changeSortUsage()">
                    <option value="default">Sắp xếp: Mặc định</option>
                    <option value="newest">Sắp xếp: Mới nhất trước</option>
                    <option value="oldest">Sắp xếp: Cũ nhất trước</option>
                </select>
            </div>
            <div id="usageListContainer" class="usage-list">
                <!-- Nội dung render bằng JS -->
            </div>
        </div>

    </div>
</div>

<!-- MODAL NHẬP THỜI GIAN THỦ CÔNG -->
<div id="timeModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Nhập thời gian</h3>
        <input type="text" id="manualTimeInput" class="modal-input" autocomplete="off">
        <div id="modalError" class="modal-error"></div>
        <div class="modal-buttons">
            <button class="btn-sm btn-undo" onclick="closeTimeModal()">Hủy</button>
            <button class="btn-sm btn-use" onclick="saveTimeModal()">Lưu</button>
        </div>
    </div>
</div>

<script>
// Khai báo biến

/* =========================================================
   1. DI CHUYỂN DỮ LIỆU CŨ (MIGRATION: Cái Nhum -> An Phước)
========================================================= */
function runDataMigration() {
    let uData = JSON.parse(localStorage.getItem('usageData')) || {};
    if (uData['cu_Xã Cái Nhum']) {
        uData['cu_Xã An Phước'] = uData['cu_Xã Cái Nhum'];
        delete uData['cu_Xã Cái Nhum'];
        localStorage.setItem('usageData', JSON.stringify(uData));
    }

    let savedCu = JSON.parse(localStorage.getItem('savedXaCu'));
    if (savedCu) {
        const idx = savedCu.indexOf("Xã Cái Nhum");
        if (idx !== -1) {
            savedCu[idx] = "Xã An Phước";
            localStorage.setItem('savedXaCu', JSON.stringify(savedCu));
        }
    }
}

   3. LOGIC CÀI ĐẶT & KÝ HIỆU
========================================================= */
const addressTypeRadios = document.querySelectorAll('input[name="addressType"]');
const checkAll = document.getElementById('checkAll');
const xaListDiv = document.getElementById('xaList');
const symbolInput = document.getElementById('symbolInput');

// Ký hiệu tên

symbolInput.addEventListener('input', () => {

// Sắp xếp

document.getElementById('sortUsage').value = currentSort;

function changeSortUsage() {

    localStorage.setItem('sortUsage', currentSort);
    renderUsageList();
}

let currentType = localStorage.getItem('addressType') || 'moi';
let savedXaMoi = JSON.parse(localStorage.getItem('savedXaMoi')) || khuVucMoi.map(k => k.xa);
let savedXaCu = JSON.parse(localStorage.getItem('savedXaCu')) || khuVucCu.map(k => k.xa);

function renderXaList() {
    const data = currentType === 'moi' ? khuVucMoi : khuVucCu;
    const activeList = currentType === 'moi' ? savedXaMoi : savedXaCu;
    xaListDiv.innerHTML = '';

    data.forEach(item => {
        const isChecked = activeList.includes(item.xa);

        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" value="${item.xa}" class="xa-checkbox" ${isChecked ? 'checked' : ''}> ${item.xa}`;

checkAll.addEventListener('change', (e) => {
    const boxes = document.querySelectorAll('.xa-checkbox');
    boxes.forEach(box => box.checked = e.target.checked);
    updateSavedXa();
});

function updateSavedXa() {
    const boxes = document.querySelectorAll('.xa-checkbox');
    const selected = Array.from(boxes).filter(b => b.checked).map(b => b.value);
    
    if (currentType === 'moi') {
        savedXaMoi = selected;
        localStorage.setItem('savedXaMoi', JSON.stringify(savedXaMoi));
    } else {
        savedXaCu = selected;
        localStorage.setItem('savedXaCu', JSON.stringify(savedXaCu));
    }
    checkAll.checked = selected.length > 0 && selected.length === boxes.length;
}

addressTypeRadios.forEach(radio => {

/* =========================================================
   4. LOGIC QUẢN LÝ "SỬ DỤNG GẦN ĐÂY" (Lưu 3 lịch sử)
========================================================= */
let usageData = JSON.parse(localStorage.getItem('usageData')) || {};
let currentEditingXa = null;

function getUsageKey(xa) { return `${currentType}_${xa}`; }

function getUsage(xa) {
    const key = getUsageKey(xa);
    let data = usageData[key] || { lastUsed: null, history: [], note: "" };
    
    // Auto-migrate old `prevUsed` string format to array `history`
    if (data.prevUsed !== undefined) {
        if (data.prevUsed !== null) {
            data.history = [data.prevUsed];
        } else {
            data.history = [];
        }
        delete data.prevUsed;
    }
    return data;
}

function setUsage(xa, data) {
    const key = getUsageKey(xa);
    usageData[key] = data;
    localStorage.setItem('usageData', JSON.stringify(usageData));
}

function getCurrentFormattedTime() {
    const pad = n => n.toString().padStart(2, '0');
    const now = new Date();
    const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    const dateStr = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
    return `${timeStr} ${dateStr}`;
}

function markUsed(xa) {
    let data = getUsage(xa);
    if (data.lastUsed) {
        data.history.push(data.lastUsed);
        if (data.history.length > 3) data.history.shift(); // Chỉ giữ 3 mốc hoàn tác
    }
    data.lastUsed = getCurrentFormattedTime();
    setUsage(xa, data);
    renderUsageList();
}

function undoUsed(xa) {
    let data = getUsage(xa);
    if (data.history && data.history.length > 0) {
        data.lastUsed = data.history.pop();
        setUsage(xa, data);
        renderUsageList();
    } else if (data.lastUsed) {
        // Hết mốc thì quay về chưa dùng
        data.lastUsed = null;
        setUsage(xa, data);
        renderUsageList();
    } else {
        alert("Không có lịch sử để hoàn tác!");
    }
}

// Xử lý modal
function openTimeModal(xa) {
    currentEditingXa = xa;
    const input = document.getElementById('manualTimeInput');
    input.value = '';
    document.getElementById('modalError').textContent = '';
    document.getElementById('timeModal').classList.add('active');
    input.focus();
}

function closeTimeModal() {
    document.getElementById('timeModal').classList.remove('active');
    currentEditingXa = null;
}

document.getElementById('manualTimeInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') saveTimeModal();
});

function parseManualTime(val) {
    const parts = val.trim().split(/\s+/);
    const timePart = parts[0];
    const datePart = parts[1] || "";

    const now = new Date();
    let hh, mm, ss = "00";
    let dd = String(now.getDate()).padStart(2, '0');
    let mo = String(now.getMonth() + 1).padStart(2, '0');
    let yyyy = now.getFullYear();

    if (timePart.length === 4) {
        hh = timePart.substring(0, 2);
        mm = timePart.substring(2, 4);
    } else if (timePart.length === 6) {
        hh = timePart.substring(0, 2);
        mm = timePart.substring(2, 4);
        ss = timePart.substring(4, 6);
    } else {
        return null; 
    }

    if (datePart) {
        if (datePart.length === 4) {
            dd = datePart.substring(0, 2);
            mo = datePart.substring(2, 4);
        } else if (datePart.length === 8) {
            dd = datePart.substring(0, 2);
            mo = datePart.substring(2, 4);
            yyyy = datePart.substring(4, 8);
        } else {
            return null;
        }
    }

    const hInt = parseInt(hh, 10);
    const mInt = parseInt(mm, 10);
    const sInt = parseInt(ss, 10);
    const dInt = parseInt(dd, 10);
    const moInt = parseInt(mo, 10);

    if (isNaN(hInt) || hInt < 0 || hInt > 23) return null;
    if (isNaN(mInt) || mInt < 0 || mInt > 59) return null;
    if (isNaN(sInt) || sInt < 0 || sInt > 59) return null;
    if (isNaN(dInt) || dInt < 1 || dInt > 31) return null;
    if (isNaN(moInt) || moInt < 1 || moInt > 12) return null;

    return `${String(hInt).padStart(2, '0')}:${String(mInt).padStart(2, '0')}:${String(sInt).padStart(2, '0')} ${String(dInt).padStart(2, '0')}/${String(moInt).padStart(2, '0')}/${yyyy}`;
}

function saveTimeModal() {
    const inputVal = document.getElementById('manualTimeInput').value;
    if (!inputVal.trim()) {
        closeTimeModal();
        return;
    }

    const formatted = parseManualTime(inputVal);
    if (!formatted) {
        document.getElementById('modalError').textContent = 'Thời gian không hợp lệ.';
        return;
    }

    let data = getUsage(currentEditingXa);
    if (data.lastUsed) {
        data.history.push(data.lastUsed);
        if (data.history.length > 3) data.history.shift();
    }
    data.lastUsed = formatted;
    setUsage(currentEditingXa, data);
    
    renderUsageList();
    closeTimeModal();
}

// Lưu Note bằng phím Enter
function handleNoteEnter(e, xa, inputElement) {
    if (e.key === 'Enter') {
        let data = getUsage(xa);
        data.note = inputElement.value;
        setUsage(xa, data);
        
        // Nháy xanh báo thành công
        inputElement.style.borderColor = "#10b981";
        inputElement.style.backgroundColor = "#d1fae5";
        setTimeout(() => {
            inputElement.style.borderColor = "";
            inputElement.style.backgroundColor = "";
        }, 800);
        
        inputElement.blur();
    }
}

// Chuyển string thành Timestamp để sắp xếp
function parseToTimestamp(str) {
    if (!str) return 0;
    const parts = str.split(' ');
    if (parts.length !== 2) return 0;
    const time = parts[0].split(':');
    const date = parts[1].split('/');
    return new Date(date[2], date[1]-1, date[0], time[0], time[1], time[2]).getTime();
}

function renderUsageList() {
    const container = document.getElementById('usageListContainer');
    container.innerHTML = '';
    
    const baseData = currentType === 'moi' ? khuVucMoi : khuVucCu;
    let listToRender = [...baseData];

    // Thuật toán sắp xếp
    if (currentSort !== 'default') {
        listToRender.sort((a, b) => {
            let timeA = parseToTimestamp(getUsage(a.xa).lastUsed);
            let timeB = parseToTimestamp(getUsage(b.xa).lastUsed);
            if (currentSort === 'newest') return timeB - timeA;
            if (currentSort === 'oldest') {
                if (timeA === 0 && timeB !== 0) return 1; // Chưa dùng quăng xuống cuối
                if (timeB === 0 && timeA !== 0) return -1;
                return timeA - timeB;
            }
        });
    }
    
    listToRender.forEach((item, index) => {
        const xa = item.xa;
        const uData = getUsage(xa);
        const timeDisplay = uData.lastUsed ? `<span>${uData.lastUsed}</span>` : "Chưa dùng";
        const noteId = `note_input_${index}`;

        const clockIcon = `
            <div class="icon-btn" onclick="openTimeModal('${xa}')" title="Chỉnh sửa giờ">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </div>
        `;

        const div = document.createElement('div');
        div.className = 'usage-item';
        div.innerHTML = `
            <div class="usage-header">
                <div class="usage-xa-name">${xa}</div>
                <div class="usage-time">Lần cuối: ${timeDisplay} ${clockIcon}</div>
            </div>
            <div class="usage-actions">
                <button class="btn-sm btn-use" onclick="markUsed('${xa}')">Dùng</button>
                <button class="btn-sm btn-undo" onclick="undoUsed('${xa}')">Hoàn tác</button>
            </div>
            <div class="note-row">
                <input type="text" id="${noteId}" placeholder="Nhập ghi chú rồi nhấn Enter" value="${uData.note}" onkeypress="handleNoteEnter(event, '${xa}', this)">
            </div>
        `;
        container.appendChild(div);
    });
}

document.querySelector(`input[value="${currentType}"]`).checked = true;
renderXaList();

/* =========================================================
   5. CÁC HÀM RANDOM
========================================================= */
function randomItem(array) { return array[Math.floor(Math.random() * array.length)]; }
function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
function randomName() {
    const laNam = Math.random() < 0.5;
    const ho = laNam ? hoNam : hoNu;
    const tenDem = laNam ? tenDemNam : tenDemNu;
    const ten = laNam ? tenNam : tenNu;
    
    let nameParts = [randomItem(ho), randomItem(tenDem), randomItem(ten)];
    let symbol = document.getElementById('symbolInput').value.trim();
    
    // Nếu có điền ký hiệu, random nhét vào sau phần tử 0, 1 hoặc 2 (không bao giờ ở đầu)
    if (symbol) {
        let pos = Math.floor(Math.random() * nameParts.length); 
        nameParts[pos] = nameParts[pos] + " " + symbol;
    }
    
    return nameParts.join(" ").replace(/\s+/g, ' ').trim();
}
function randomSoNha() {
    const number = Math.floor(Math.random() * 800) + 1;
    let soNha = String(number).padStart(3, "0");
    if (Math.random() < 0.5) soNha += randomItem(["A", "B", "C", "D", "E", "F", "G", "H"]);
    const random = Math.random();
    if (random < 0.33) return `Số nhà ${soNha}`;
    if (random < 0.66) return `Số ${soNha}`;
    return soNha;
}
function randomDiaDiem() {
    const loai = randomItem(loaiDiaDiem);
    const laNam = Math.random() < 0.5;
    const tenDem = laNam ? tenDemNam : tenDemNu;
    const ten = laNam ? tenNam : tenNu;
    return `${loai} ${randomItem(tenDem)} ${randomItem(ten)}`;
}

function randomAddress() {
    const data = currentType === 'moi' ? khuVucMoi : khuVucCu;
    const activeXaList = currentType === 'moi' ? savedXaMoi : savedXaCu;

    if (activeXaList.length === 0) {
        alert("Tạo thất bại: Bạn chưa chọn xã nào trong phần Cài đặt dữ liệu hành chính!");
        generatedRandomPart = "";
        generatedAdminPart = "";
        return "Lỗi: Chưa chọn xã";
    }

    const validKhuVuc = data.filter(k => activeXaList.includes(k.xa));
    const selectedArea = randomItem(validKhuVuc);
    const xa = selectedArea.xa;
    const ap = randomItem(selectedArea.ap);

    const otherTypes = shuffle(["soNha", "duong", "diaDiem"]).slice(0, 2);
    let parts = [ap];
    otherTypes.forEach(type => {
        if (type === "soNha") parts.push(randomSoNha());
        else if (type === "duong") parts.push(randomItem(duong));
        else if (type === "diaDiem") parts.push(randomDiaDiem());
    });
    parts = shuffle(parts);

    generatedRandomPart = parts.join(", ");
    
    if (currentType === 'cu') {
        const huyen = (xa === "Xã An Phước") ? "huyện Mang Thít" : "huyện Vũng Liêm";
        generatedAdminPart = `${xa}, ${huyen}, tỉnh Vĩnh Long`;
    } else {
        generatedAdminPart = `${xa}, tỉnh Vĩnh Long`;
    }

    return `${generatedRandomPart}, ${generatedAdminPart}`;
}

/* =========================================================
   6. HÀM GIAO TIẾP VỚI GIAO DIỆN (GENERATE & COPY)
========================================================= */
function generateAll() {
    const name = randomName();
    const address = randomAddress();

    if(address === "Lỗi: Chưa chọn xã") {
        document.getElementById("nameOutput").textContent = "---";
        document.getElementById("addressOutput").textContent = "---";
        return;
    }

    document.getElementById("nameOutput").textContent = name;
    document.getElementById("addressOutput").textContent = address;
    document.getElementById("status").textContent = "";
}

function showCopyStatus(msg) {
    const status = document.getElementById("status");
    status.textContent = msg;
    setTimeout(() => { status.textContent = ""; }, 2000);
}

async function copyText(text, successMsg) {
    if (!text || text === "---" || text === "Lỗi: Chưa chọn xã") return;
    try {
        await navigator.clipboard.writeText(text);
        showCopyStatus(successMsg);
    } catch (error) {
        showCopyStatus("Không thể sao chép tự động.");
    }
}

function copyName() {
    const name = document.getElementById("nameOutput").textContent;
    copyText(name, "Đã sao chép Tên!");
}

function copyAddress() {
    const address = document.getElementById("addressOutput").textContent;
    copyText(address, "Đã sao chép Địa chỉ hoàn chỉnh!");
}

function copyAll() {
    const name = document.getElementById("nameOutput").textContent;
    const address = document.getElementById("addressOutput").textContent;
    if(address === "Lỗi: Chưa chọn xã" || address === "---") return;
    const text = `Tên: ${name}\nĐịa chỉ: ${address}`;
    copyText(text, "Đã sao chép Tên và Địa chỉ!");
}

function copyRandomPart() {
    copyText(generatedRandomPart, "Đã sao chép Phần địa chỉ!");
}

function copyAdminPart() {
    copyText(generatedAdminPart, "Đã sao chép Xã đang chọn!");
}

// Chạy lần đầu tiên
generateAll();
