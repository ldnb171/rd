/* =========================================================
   6. HÀM RANDOM
========================================================= */

function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}


/* =========================================================
   7. TẠO TÊN NGƯỜI
========================================================= */

function randomName() {

    const h = randomItem(ho);
    const d = randomItem(tenDem);
    const t = randomItem(ten);

    return `${h} ${d} ${t}`;
}


/* =========================================================
   8. TẠO SỐ NHÀ
   001 - 700
   Có thể kèm A/B/C/D/E/F
========================================================= */

function randomSoNha() {

    const number = Math.floor(Math.random() * 700) + 1;

    const formatted = String(number).padStart(3, "0");

    const letters = ["", "A", "B", "C", "D", "E", "F"];

    const letter = randomItem(letters);

    return formatted + letter;
}


/* =========================================================
   9. TẠO TÊN ĐỊA ĐIỂM
========================================================= */

function randomDiaDiem() {

    const loai = randomItem(loaiDiaDiem);
    const ten = randomItem(tenDiaDiem);

    return `${loai} ${ten}`;
}


/* =========================================================
   10. TẠO 1 TRONG 3 TIỀN TỐ
========================================================= */

function randomTienTo() {

    const loai = randomItem([
        "soNha",
        "duong",
        "diaDiem"
    ]);

    if (loai === "soNha") {
        return randomSoNha();
    }

    if (loai === "duong") {
        return randomItem(duong);
    }

    return randomDiaDiem();
}


/* =========================================================
   11. SHUFFLE
========================================================= */

function shuffle(array) {

    const arr = [...array];

    for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}


/* =========================================================
   12. TẠO ĐỊA CHỈ
========================================================= */

function randomAddress() {

    /*
        Chọn xã trước.
        Sau đó chỉ lấy ấp trong đúng xã đó.
    */

    const selectedArea = randomItem(khuVuc);

    const xa = selectedArea.xa;

    const ap = randomItem(selectedArea.ap);


    /*
        Có 4 loại thành phần:
        - số nhà
        - đường
        - địa điểm
        - ấp

        Chúng ta cần đúng 3 thành phần.

        Ấp luôn bắt buộc.
        Hai thành phần còn lại lấy từ 3 loại còn lại.
    */

    const otherTypes = shuffle([
        "soNha",
        "duong",
        "diaDiem"
    ]).slice(0, 2);


    let parts = [];

    // Thêm Ấp
    parts.push(ap);


    // Thêm 2 thành phần khác
    otherTypes.forEach(type => {

        if (type === "soNha") {
            parts.push(randomSoNha());
        }

        else if (type === "duong") {
            parts.push(randomItem(duong));
        }

        else if (type === "diaDiem") {
            parts.push(randomDiaDiem());
        }

    });


    /*
        Xáo trộn hoàn toàn thứ tự.
    */

    parts = shuffle(parts);


    /*
        Cuối cùng mới thêm xã + tỉnh.
    */

    return parts.join(", ") + ", " + xa + ", tỉnh Vĩnh Long";
}


/* =========================================================
   13. TẠO TẤT CẢ
========================================================= */

function generateAll() {

    const name = randomName();

    const address = randomAddress();

    document.getElementById("nameOutput").textContent = name;

    document.getElementById("addressOutput").textContent = address;

    document.getElementById("status").textContent = "";
}


/* =========================================================
   14. SAO CHÉP
========================================================= */

async function copyAll() {

    const name = document.getElementById("nameOutput").textContent;

    const address = document.getElementById("addressOutput").textContent;

    const text =
        `Tên: ${name}\n` +
        `Địa chỉ: ${address}`;


    try {

        await navigator.clipboard.writeText(text);

        document.getElementById("status").textContent =
            "Đã sao chép tên và địa chỉ!";

        setTimeout(() => {

            document.getElementById("status").textContent = "";

        }, 2000);

    }

    catch (error) {

        document.getElementById("status").textContent =
            "Không thể sao chép tự động.";

    }
}


/* =========================================================
   15. CHẠY NGAY KHI MỞ TRANG
========================================================= */
