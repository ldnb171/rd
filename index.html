<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Random Tên & Địa Chỉ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 760px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(15, 23, 42, 0.10);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            font-size: 14px;
        }

        /* --- SETTINGS AREA --- */
        .settings-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .checkbox-container {
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            max-height: 180px;
            overflow-y: auto;
        }

        .check-all {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .xa-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .xa-list label {
            cursor: pointer;
            font-size: 15px;
        }

        /* --- RESULTS AREA --- */
        .result-box {
            margin-bottom: 18px;
        }

        .label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .output {
            min-height: 56px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            padding: 15px 16px;
            font-size: 17px;
            line-height: 1.5;
            word-break: break-word;
        }

        .address {
            font-size: 16px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .random-btn {
            flex: 1;
            background: #4f46e5;
            color: white;
        }

        .random-btn:hover {
            background: #4338ca;
        }

        .copy-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .copy-btn:hover {
            background: #cbd5e1;
        }

        .status {
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
            font-size: 13px;
            color: #16a34a;
        }

        @media (max-width: 600px) {
            .card { padding: 22px; }
            h1 { font-size: 24px; }
            .button-row { flex-direction: column; }
            .copy-btn { width: 100%; }
            .xa-list { grid-template-columns: 1fr; }
        }
    </style>
</head>

let savedXaCu = JSON.parse(localStorage.getItem('savedXaCu')) || khuVucCu.map(k => k.xa);

function renderXaList() {
    const data = currentType === 'moi' ? khuVucMoi : khuVucCu;
    const activeList = currentType === 'moi' ? savedXaMoi : savedXaCu;
    xaListDiv.innerHTML = '';
    
    let allChecked = true;

    data.forEach(item => {
        const isChecked = activeList.includes(item.xa);
        if (!isChecked) allChecked = false;

        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" value="${item.xa}" class="xa-checkbox" ${isChecked ? 'checked' : ''}> ${item.xa}`;
        
        label.querySelector('input').addEventListener('change', () => {
            updateSavedXa();
        });
        
        xaListDiv.appendChild(label);
    });

    checkAll.checked = allChecked;
}

checkAll.addEventListener('change', (e) => {
    const boxes = document.querySelectorAll('.xa-checkbox');
    boxes.forEach(box => box.checked = e.target.checked);
    updateSavedXa();
});

function updateSavedXa() {
    const boxes = document.querySelectorAll('.xa-checkbox');
    const selected = Array.from(boxes).filter(b => b.checked).map(b => b.value);
    
    if (currentType === 'moi') {
        savedXaMoi = selected;
        localStorage.setItem('savedXaMoi', JSON.stringify(savedXaMoi));
    } else {
        savedXaCu = selected;
        localStorage.setItem('savedXaCu', JSON.stringify(savedXaCu));
    }

    checkAll.checked = selected.length > 0 && selected.length === boxes.length;
}

addressTypeRadios.forEach(radio => {
    radio.addEventListener('change', (e) => {
        currentType = e.target.value;
        localStorage.setItem('addressType', currentType);
        renderXaList();
    });
});

   5. CÁC HÀM RANDOM
========================================================= */
function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function randomName() {
    const laNam = Math.random() < 0.5;
    const ho = laNam ? hoNam : hoNu;
    const tenDem = laNam ? tenDemNam : tenDemNu;
    const ten = laNam ? tenNam : tenNu;
    return `${randomItem(ho)} ${randomItem(tenDem)} ${randomItem(ten)}`;
}

// Random Số nhà từ 001 đến 800, tỉ lệ 50% có chữ cái (A-H)
function randomSoNha() {
    const number = Math.floor(Math.random() * 800) + 1;
    let soNha = String(number).padStart(3, "0");

    if (Math.random() < 0.5) {
        const letters = ["A", "B", "C", "D", "E", "F", "G", "H"];
        soNha += randomItem(letters);
    }

    const random = Math.random();
    if (random < 0.33) return `Số nhà ${soNha}`;
    if (random < 0.66) return `Số ${soNha}`;
    return soNha;
}

function randomDiaDiem() {
    const loai = randomItem(loaiDiaDiem);
    const laNam = Math.random() < 0.5;
    const tenDem = laNam ? tenDemNam : tenDemNu;
    const ten = laNam ? tenNam : tenNu;
    return `${loai} ${randomItem(tenDem)} ${randomItem(ten)}`;
}

    let parts = [ap];

    otherTypes.forEach(type => {
        if (type === "soNha") parts.push(randomSoNha());
        else if (type === "duong") parts.push(randomItem(duong));
        else if (type === "diaDiem") parts.push(randomDiaDiem());
    });

    parts = shuffle(parts);

    // Cấu trúc địa chỉ theo loại
    if (currentType === 'cu') {
        const huyen = (xa === "Xã Cái Nhum") ? "huyện Mang Thít" : "huyện Vũng Liêm";
        return parts.join(", ") + ", " + xa + ", " + huyen + ", tỉnh Vĩnh Long";
    } else {
        return parts.join(", ") + ", " + xa + ", tỉnh Vĩnh Long";
    }
}

/* =========================================================
   6. HÀM GIAO TIẾP VỚI GIAO DIỆN
========================================================= */
function generateAll() {
    const name = randomName();
    const address = randomAddress();

    if(address === "Lỗi: Chưa chọn xã") {
        document.getElementById("nameOutput").textContent = "---";
        document.getElementById("addressOutput").textContent = "---";
        return;
    }

    document.getElementById("nameOutput").textContent = name;
    document.getElementById("addressOutput").textContent = address;
    document.getElementById("status").textContent = "";
}

async function copyAll() {
    const name = document.getElementById("nameOutput").textContent;
    const address = document.getElementById("addressOutput").textContent;

    if(address === "Lỗi: Chưa chọn xã" || address === "---") return;

    const text = `Tên: ${name}\nĐịa chỉ: ${address}`;

    try {
        await navigator.clipboard.writeText(text);
        document.getElementById("status").textContent = "Đã sao chép tên và địa chỉ!";
        setTimeout(() => { document.getElementById("status").textContent = ""; }, 2000);
    } catch (error) {
        document.getElementById("status").textContent = "Không thể sao chép tự động.";
    }
}

// Chạy lần đầu tiên
generateAll();
