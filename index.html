<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Tên & Địa Chỉ</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(15, 23, 42, 0.10);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            font-size: 14px;
        }

        /* --- SETTINGS AREA --- */
        .settings-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .checkbox-container {
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            max-height: 180px;
            overflow-y: auto;
        }

        .check-all {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .xa-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .xa-list label {
            cursor: pointer;
            font-size: 15px;
        }

        /* --- RESULTS AREA --- */
        .result-box {
            margin-bottom: 18px;
        }

        .label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .output {
            min-height: 56px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            padding: 15px 16px;
            font-size: 17px;
            line-height: 1.5;
            word-break: break-word;
        }

        .address {
            font-size: 16px;
        }

        /* --- BUTTONS --- */
        .button-row {
            display: flex;
            margin-top: 24px;
        }

        .copy-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .random-btn {
            width: 100%;
            background: #4f46e5;
            color: white;
            font-size: 16px;
        }

        .random-btn:hover { background: #4338ca; }

        .copy-btn {
            flex: 1;
            background: #e2e8f0;
            color: #334155;
            font-size: 14px;
            padding: 10px;
        }

        .copy-btn:hover { background: #cbd5e1; }

        .status {
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
            font-size: 13px;
            color: #16a34a;
            font-weight: bold;
        }

        /* --- USAGE LOG SECTION --- */
        .usage-section {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px dashed #cbd5e1;
        }

        .usage-section h2 {
            margin: 0 0 15px 0;
            font-size: 20px;
            color: #1e293b;
        }

        .usage-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .usage-item {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 15px;
        }

        .usage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .usage-xa-name {
            font-weight: bold;
            font-size: 16px;
            color: #0f172a;
        }

        .usage-time {
            font-size: 13px;
            color: #64748b;
        }

        .usage-time span {
            font-weight: bold;
            color: #3b82f6;
        }

        .usage-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-use { background: #3b82f6; color: white; }
        .btn-use:hover { background: #2563eb; }
        
        .btn-undo { background: #f59e0b; color: white; }
        .btn-undo:hover { background: #d97706; }

        .note-row {
            display: flex;
            gap: 8px;
        }

        .note-row input {
            flex: 1;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
        }
        
        .note-row input:focus {
            border-color: #3b82f6;
        }

        .btn-save-note { background: #10b981; color: white; }
        .btn-save-note:hover { background: #059669; }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            h1 { font-size: 24px; }
            .copy-row { flex-direction: column; }
            .xa-list { grid-template-columns: 1fr; }
            .usage-header { flex-direction: column; align-items: flex-start; gap: 4px; }
        }
    </style>
</head>

const addressTypeRadios = document.querySelectorAll('input[name="addressType"]');
const checkAll = document.getElementById('checkAll');
const xaListDiv = document.getElementById('xaList');

let currentType = localStorage.getItem('addressType') || 'moi';
let savedXaMoi = JSON.parse(localStorage.getItem('savedXaMoi')) || khuVucMoi.map(k => k.xa);
let savedXaCu = JSON.parse(localStorage.getItem('savedXaCu')) || khuVucCu.map(k => k.xa);

function renderXaList() {
    const data = currentType === 'moi' ? khuVucMoi : khuVucCu;
    const activeList = currentType === 'moi' ? savedXaMoi : savedXaCu;
    xaListDiv.innerHTML = '';
    
    let allChecked = true;

    data.forEach(item => {
        const isChecked = activeList.includes(item.xa);
        if (!isChecked) allChecked = false;

        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" value="${item.xa}" class="xa-checkbox" ${isChecked ? 'checked' : ''}> ${item.xa}`;
        label.querySelector('input').addEventListener('change', updateSavedXa);
        xaListDiv.appendChild(label);
    });

    checkAll.checked = allChecked;
    renderUsageList(); // Render log khu vực bên dưới luôn
}

checkAll.addEventListener('change', (e) => {
    const boxes = document.querySelectorAll('.xa-checkbox');
    boxes.forEach(box => box.checked = e.target.checked);
    updateSavedXa();
});

function updateSavedXa() {
    const boxes = document.querySelectorAll('.xa-checkbox');
    const selected = Array.from(boxes).filter(b => b.checked).map(b => b.value);

        savedXaMoi = selected;
        localStorage.setItem('savedXaMoi', JSON.stringify(savedXaMoi));
    } else {
        savedXaCu = selected;
        localStorage.setItem('savedXaCu', JSON.stringify(savedXaCu));
    }
    checkAll.checked = selected.length > 0 && selected.length === boxes.length;
}

addressTypeRadios.forEach(radio => {
    radio.addEventListener('change', (e) => {
        currentType = e.target.value;
        localStorage.setItem('addressType', currentType);
        renderXaList();
    });
});

/* =========================================================
   5. LOGIC QUẢN LÝ "SỬ DỤNG GẦN ĐÂY"
========================================================= */
let usageData = JSON.parse(localStorage.getItem('usageData')) || {};

function getUsageKey(xa) {
    return `${currentType}_${xa}`;
}

function getUsage(xa) {
    const key = getUsageKey(xa);
    return usageData[key] || { lastUsed: null, prevUsed: null, note: "" };
}

function setUsage(xa, data) {
    const key = getUsageKey(xa);
    usageData[key] = data;
    localStorage.setItem('usageData', JSON.stringify(usageData));
}

function markUsed(xa) {
    let data = getUsage(xa);
    data.prevUsed = data.lastUsed;
    
    // Lấy giờ hiện tại format DD/MM/YYYY HH:MM:SS
    const now = new Date();
    data.lastUsed = now.toLocaleString('vi-VN');
    
    setUsage(xa, data);
    renderUsageList();
}

function undoUsed(xa) {
    let data = getUsage(xa);
    if (data.prevUsed !== null) {
        data.lastUsed = data.prevUsed;
        data.prevUsed = null; // Chỉ cho hoàn tác 1 lần
        setUsage(xa, data);
        renderUsageList();
    } else {
        alert("Không có thao tác nào gần đây để hoàn tác cho xã này!");
    }
}

function saveNoteLocal(xa, inputId, btnId) {
    let data = getUsage(xa);
    data.note = document.getElementById(inputId).value;
    setUsage(xa, data);
    
    // Feedback
    const btn = document.getElementById(btnId);
    btn.textContent = "Đã lưu ✓";
    btn.style.background = "#059669"; // Màu đậm hơn chút
    setTimeout(() => {
        btn.textContent = "Lưu";
        btn.style.background = ""; // Trả về css gốc
    }, 2000);
}

function renderUsageList() {
    const container = document.getElementById('usageListContainer');
    container.innerHTML = '';
    
    const data = currentType === 'moi' ? khuVucMoi : khuVucCu;
    
    data.forEach((item, index) => {
        const xa = item.xa;
        const uData = getUsage(xa);
        const timeDisplay = uData.lastUsed ? `<span>${uData.lastUsed}</span>` : "Chưa dùng";
        const noteId = `note_input_${index}`;
        const btnId = `btn_note_${index}`;

        const div = document.createElement('div');
        div.className = 'usage-item';
        div.innerHTML = `
            <div class="usage-header">
                <div class="usage-xa-name">${xa}</div>
                <div class="usage-time">Lần cuối: ${timeDisplay}</div>
            </div>
            <div class="usage-actions">
                <button class="btn-sm btn-use" onclick="markUsed('${xa}')">Dùng</button>
                <button class="btn-sm btn-undo" onclick="undoUsed('${xa}')">Hoàn tác</button>
            </div>
            <div class="note-row">
                <input type="text" id="${noteId}" placeholder="Ghi chú công việc..." value="${uData.note}">
                <button id="${btnId}" class="btn-sm btn-save-note" onclick="saveNoteLocal('${xa}', '${noteId}', '${btnId}')">Lưu</button>
            </div>
        `;
        container.appendChild(div);
    });
}

// Khởi tạo ban đầu
document.querySelector(`input[value="${currentType}"]`).checked = true;
renderXaList();

/* =========================================================
   6. CÁC HÀM RANDOM
========================================================= */
function randomItem(array) { return array[Math.floor(Math.random() * array.length)]; }
function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
function randomName() {
    const laNam = Math.random() < 0.5;
    const ho = laNam ? hoNam : hoNu;
    const tenDem = laNam ? tenDemNam : tenDemNu;
    const ten = laNam ? tenNam : tenNu;
    return `${randomItem(ho)} ${randomItem(tenDem)} ${randomItem(ten)}`;
}
function randomSoNha() {
    const number = Math.floor(Math.random() * 800) + 1;
    let soNha = String(number).padStart(3, "0");
    if (Math.random() < 0.5) soNha += randomItem(["A", "B", "C", "D", "E", "F", "G", "H"]);
    const random = Math.random();
    if (random < 0.33) return `Số nhà ${soNha}`;
    if (random < 0.66) return `Số ${soNha}`;
    return soNha;
}
function randomDiaDiem() {
    const loai = randomItem(loaiDiaDiem);
    const laNam = Math.random() < 0.5;
    const tenDem = laNam ? tenDemNam : tenDemNu;
    const ten = laNam ? tenNam : tenNu;
    return `${loai} ${randomItem(tenDem)} ${randomItem(ten)}`;
}

function randomAddress() {
    const data = currentType === 'moi' ? khuVucMoi : khuVucCu;
    const activeXaList = currentType === 'moi' ? savedXaMoi : savedXaCu;

    if (activeXaList.length === 0) {
        alert("Tạo thất bại: Bạn chưa chọn xã nào trong phần Cài đặt dữ liệu hành chính!");
        return "Lỗi: Chưa chọn xã";
    }

    const validKhuVuc = data.filter(k => activeXaList.includes(k.xa));
    const selectedArea = randomItem(validKhuVuc);
    const xa = selectedArea.xa;
    const ap = randomItem(selectedArea.ap);

    const otherTypes = shuffle(["soNha", "duong", "diaDiem"]).slice(0, 2);
    let parts = [ap];
    otherTypes.forEach(type => {
        if (type === "soNha") parts.push(randomSoNha());
        else if (type === "duong") parts.push(randomItem(duong));
        else if (type === "diaDiem") parts.push(randomDiaDiem());
    });
    parts = shuffle(parts);

    if (currentType === 'cu') {
        const huyen = (xa === "Xã Cái Nhum") ? "huyện Mang Thít" : "huyện Vũng Liêm";
        return parts.join(", ") + ", " + xa + ", " + huyen + ", tỉnh Vĩnh Long";
    } else {
        return parts.join(", ") + ", " + xa + ", tỉnh Vĩnh Long";
    }
}

/* =========================================================
   7. HÀM GIAO TIẾP VỚI GIAO DIỆN (GENERATE & COPY)
========================================================= */
function generateAll() {
    const name = randomName();
    const address = randomAddress();

    if(address === "Lỗi: Chưa chọn xã") {
        document.getElementById("nameOutput").textContent = "---";
        document.getElementById("addressOutput").textContent = "---";
        return;
    }

    document.getElementById("nameOutput").textContent = name;
    document.getElementById("addressOutput").textContent = address;
    document.getElementById("status").textContent = "";
}

function showCopyStatus(msg) {
    const status = document.getElementById("status");
    status.textContent = msg;
    setTimeout(() => { status.textContent = ""; }, 2000);
}

async function copyText(text, successMsg) {
    if (!text || text === "---" || text === "Lỗi: Chưa chọn xã") return;
    try {
        await navigator.clipboard.writeText(text);
        showCopyStatus(successMsg);
    } catch (error) {
        showCopyStatus("Không thể sao chép tự động.");
    }
}

function copyName() {
    const name = document.getElementById("nameOutput").textContent;
    copyText(name, "Đã sao chép Tên!");
}

function copyAddress() {
    const address = document.getElementById("addressOutput").textContent;
    copyText(address, "Đã sao chép Địa chỉ!");
}

function copyAll() {
    const name = document.getElementById("nameOutput").textContent;
    const address = document.getElementById("addressOutput").textContent;
    if(address === "Lỗi: Chưa chọn xã" || address === "---") return;
    const text = `Tên: ${name}\nĐịa chỉ: ${address}`;
    copyText(text, "Đã sao chép Tên và Địa chỉ!");
}

// Chạy lần đầu tiên
generateAll();
